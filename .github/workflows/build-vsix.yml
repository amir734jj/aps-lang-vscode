name: Build VSIX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out APS
        uses: actions/checkout@v4
        with:
          repository: amir734jj/aps
          path: aps-upstream
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Test lexer and parser against upstream APS examples
        env:
          APS_EXAMPLES: ${{ github.workspace }}/aps-upstream/examples
        run: npm run test:corpus

      - name: Package extension
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: aps-lang-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14