name: Build VSIX

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out APS
        uses: actions/checkout@v4
        with:
          repository: amir734jj/aps
          path: aps-upstream
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Test language service against upstream APS examples
        env:
          APS_CORPUS: ${{ github.workspace }}/aps-upstream/examples
        run: npm run test:corpus

      - name: Test language service against upstream APS base
        env:
          APS_CORPUS: ${{ github.workspace }}/aps-upstream/base
        run: npm run test:corpus

      - name: Package extension
        run: npm run package

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expected)"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: aps-lang-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --verify-tag --generate-notes --title "APS Language IDE $GITHUB_REF_NAME"