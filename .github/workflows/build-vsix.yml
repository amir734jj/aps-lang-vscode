name: Build VSIX

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-vsix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out APS
        uses: actions/checkout@v4
        with:
          repository: amir734jj/aps
          path: aps-upstream
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Test language service against upstream APS examples
        env:
          APS_CORPUS: ${{ github.workspace }}/aps-upstream/examples
        run: npm run test:corpus

      - name: Test language service against upstream APS base
        env:
          APS_CORPUS: ${{ github.workspace }}/aps-upstream/base
        run: npm run test:corpus

      - name: Package extension
        run: npm run package

      - name: Verify single VSIX
        shell: bash
        run: |
          expected="aps-lang-$(node -p 'require("./package.json").version').vsix"
          mapfile -t packages < <(find . -maxdepth 1 -type f -name '*.vsix' -printf '%f\n')
          if [[ ${#packages[@]} -ne 1 || "${packages[0]}" != "$expected" ]]; then
            printf 'Expected only %s, found: %s\n' "$expected" "${packages[*]:-none}" >&2
            exit 1
          fi
          mv "$expected" aps-lang-latest.vsix
          echo "VSIX_PATH=aps-lang-latest.vsix" >> "$GITHUB_ENV"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: aps-lang-vsix
          path: ${{ env.VSIX_PATH }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish latest GitHub release
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --target "$GITHUB_SHA" --title "latest" --notes "Latest successful build from the master branch."
            gh release upload latest "$VSIX_PATH" --clobber
          else
            gh release create latest "$VSIX_PATH" --verify-tag --target "$GITHUB_SHA" --title "latest" --notes "Latest successful build from the master branch."
          fi

          while read -r release; do
            [[ -z "$release" ]] || gh release delete "$release" --yes
          done < <(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName != "latest") | .tagName')